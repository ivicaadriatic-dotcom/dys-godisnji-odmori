body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--surf3);border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
/* Sidebar */
#sb{width:var(--sbw);min-width:var(--sbw);background:var(--sb);border-right:1px solid var(--bord);display:flex;flex-direction:column;height:100%;z-index:60;transition:transform .28s cubic-bezier(.3,.8,.3,1)}
.sb-logo{padding:26px 18px 18px;border-bottom:1px solid var(--bord);text-align:center;min-height:96px;display:flex;align-items:center;justify-content:center;flex-direction:column}
.sb-logo img{max-width:200px;max-height:70px;object-fit:contain}.plate{width:100%;border-radius:14px;padding:12px 14px 11px;background:transparent;line-height:0}html[data-theme=dark] .plate{background:#fff}.plate svg{width:100%;height:auto;display:block}.sb-logo{padding:18px 14px 14px;min-height:0}
.wm1{font-size:17px;font-weight:800;letter-spacing:3px;color:var(--text);line-height:1}
.wm2{font-size:11px;font-weight:700;letter-spacing:4.5px;color:var(--muted);margin-top:8px}
.sb-co{margin:14px 12px 6px;padding:10px 12px;background:var(--surf);border:1px solid var(--bord);border-radius:14px;display:flex;align-items:center;gap:10px;text-align:left;width:calc(100% - 24px)}
.sb-co:hover{border-color:var(--bord2)}
.co-ic{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5e5ce6,#bf5af2);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.co-ic svg{width:16px;height:16px}
.co-t{flex:1;min-width:0}.co-t b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.co-t small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.sbn{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nv{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:var(--text2);font-weight:600;font-size:13.5px;cursor:pointer;margin-bottom:2px;border:0;background:none;width:100%;text-align:left;transition:background .15s}
.nv:hover{background:var(--surf)}
.nv.on{background:var(--acc);color:#fff;box-shadow:0 4px 14px rgba(7,65,173,.35);position:relative}.nv.on::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--lime)}.nv.on .cnt{margin-right:14px}
.nv .cnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--surf2);padding:1px 8px;border-radius:10px}
.nv.on .cnt{background:rgba(255,255,255,.22);color:#fff}
.sb-sec{font-size:10.5px;font-weight:700;letter-spacing:.9px;color:var(--muted);text-transform:uppercase;padding:16px 11px 7px}
.sb-foot{padding:12px;border-top:1px solid var(--bord);display:flex;flex-direction:column;gap:6px}
.sb-foot .btn{width:100%;justify-content:center}
.fstat{font-size:10.5px;color:var(--muted);text-align:center}.sb-ver{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);font-weight:600;padding:2px 2px 0;letter-spacing:.3px}.sb-ver .lnk{font-size:11px}.vtag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:rgba(216,222,126,.16);color:#c9cf6a;letter-spacing:.3px}html[data-theme=light] .vtag{color:#7d8420;background:rgba(216,222,126,.35)}
#sbOv{display:none}
/* Main */
#main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
#tb{display:flex;align-items:center;gap:12px;padding:18px 28px 14px;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--bord);z-index:20;padding-top:max(18px,env(safe-area-inset-top))}
.tb-t{flex:1;min-width:0}
.crumb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tbTitle{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-r{display:flex;align-items:center;gap:8px}
.yr{display:flex;align-items:center;background:var(--surf);border:1px solid var(--bord);border-radius:11px;height:36px}
.yr button{border:0;background:none;width:30px;height:100%;color:var(--muted);display:flex;align-items:center;justify-content:center}
.yr button:hover{color:var(--blue)}
.yr b{font-size:14px;min-width:42px;text-align:center}
.ib{width:36px;height:36px;border-radius:11px;border:1px solid var(--bord);background:var(--surf);display:inline-flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.ib:hover{color:var(--blue);border-color:var(--bord2)}
.ib.sm{width:32px;height:32px;border-radius:9px}
.ib.sm svg{width:16px;height:16px}
.ib.dang:hover{color:var(--red)}
.mob{display:none}.mlogo{display:none}
#content{flex:1;overflow-y:auto;padding:22px 28px 40px;-webkit-overflow-scrolling:touch}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 15px;border-radius:11px;border:1px solid var(--bord);background:var(--surf);font-weight:600;font-size:13px;color:var(--text);white-space:nowrap;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.12)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--acc);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(7,65,173,.3)}
.btn.grn{background:var(--green);border-color:transparent;color:#fff}
.btn.pur{background:var(--purple);border-color:transparent;color:#fff}
.btn.red{background:var(--red);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:9px}
.lnk{border:0;background:none;color:var(--blue);font-weight:600;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.lnk svg{width:14px;height:14px}
/* Cards */
.card{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-t{font-size:15px;font-weight:700}
.card-s{font-size:12px;color:var(--muted);margin-top:2px}
.sq{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.sq svg{width:16px;height:16px}
.sq.blue{background:var(--acc)}.sq.green{background:var(--green)}.sq.red{background:var(--red)}.sq.orange{background:var(--orange)}.sq.purple{background:var(--purple)}.sq.teal{background:var(--teal)}
.sec-lbl{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:0;text-transform:none;white-space:nowrap}
.chip.g{background:rgba(48,209,88,.15);color:var(--green)}.chip.o{background:rgba(255,159,10,.15);color:var(--orange)}.chip.r{background:rgba(255,69,58,.15);color:var(--red)}.chip.b{background:rgba(58,120,242,.15);color:var(--blue)}.chip.p{background:rgba(191,90,242,.15);color:var(--purple)}.chip.n{background:var(--surf2);color:var(--muted)}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g32{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:14px}
.mb{margin-bottom:14px}.mb2{margin-bottom:22px}
.st{min-width:0;cursor:pointer;transition:transform .15s,border-color .15s;min-height:104px;display:flex;flex-direction:column}
.st:hover{transform:translateY(-2px);border-color:var(--bord2)}
.st-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.st-t{font-size:13.5px;font-weight:700}
.st-s{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.st-s span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi-h{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--text2);font-weight:600}
.kpi-v{font-size:30px;font-weight:800;letter-spacing:-.8px;margin:12px 0 4px;line-height:1}
.kpi-s{font-size:11.5px;color:var(--muted)}
.c-red{color:var(--red)}.c-green{color:var(--green)}.c-orange{color:var(--orange)}.c-blue{color:var(--blue)}.c-muted{color:var(--muted)}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bord)}
.li:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.av.lg{width:58px;height:58px;font-size:19px}
.li-b{flex:1;min-width:0}
.li-n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-s{font-size:11.5px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:13px}
.empty svg{width:30px;height:30px;margin-bottom:8px;opacity:.7}
.clk{cursor:pointer}.clk:hover .li-n{color:var(--blue)}
/* progress */
.pb{height:7px;background:var(--surf2);border-radius:6px;overflow:hidden;display:flex}
.pb i{display:block;height:100%}
.pr-row{display:grid;grid-template-columns:170px 1fr 92px;align-items:center;gap:12px;padding:7px 0}
.pr-n{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pr-n:hover{color:var(--blue)}
.pr-v{font-size:12px;text-align:right;color:var(--muted)}.pr-v b{color:var(--text)}
/* coverage calendar */
.cov{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cov-h{font-size:10.5px;color:var(--muted);text-align:center;padding-bottom:3px;font-weight:600}
.cov-d{aspect-ratio:1.15;border-radius:9px;background:var(--surf2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);position:relative;cursor:default;transition:transform .12s}
.cov-d:hover{transform:scale(1.06)}
.cov-d.we{opacity:.45}
.cov-d.hol{box-shadow:inset 0 0 0 1.5px rgba(64,200,224,.6)}
.cov-d.td{box-shadow:inset 0 0 0 2px var(--blue);color:var(--text);font-weight:700}
.cov-d b{font-size:12px;color:#fff}
.cov-d.x{color:#fff}
.cov-nav{display:flex;align-items:center;gap:4px}
/* annual calendar */
.ycal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mo{background:var(--surf2);border-radius:13px;padding:11px}
.mo-n{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;color:var(--text2);display:flex;justify-content:space-between}
.mo-n span{color:var(--blue);text-transform:none;letter-spacing:0}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mh{font-size:9px;font-weight:700;text-align:center;color:var(--muted);padding:2px 0}
.mh.sa{color:var(--orange)}.mh.su{color:var(--red)}
.md{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;border-radius:6px;position:relative;color:var(--text2)}
.md.sa{color:var(--orange)}.md.su{color:var(--red)}.md.hol{background:rgba(64,200,224,.18);color:var(--teal)}
.md.v{color:#fff;font-weight:700}
.md.td{outline:1.5px solid var(--blue);outline-offset:-1px}
.md .dot{position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--bord)}
.lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text2);cursor:pointer}
.lg i{width:10px;height:10px;border-radius:3px;display:block}
.lg.off{opacity:.35}
/* decisions */
.dec{display:flex;align-items:center;gap:14px;padding:13px 16px;margin-bottom:8px}
.dec-y{text-align:center;min-width:54px}
.dec-y b{display:block;font-size:22px;font-weight:800;letter-spacing:-.7px;line-height:1}
.dec-y small{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
.dec-b{flex:1;min-width:0}
.dec-p{font-size:14px;font-weight:600}
.dec-m{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px}
.dec-m span{display:inline-flex;align-items:center;gap:4px}
.dec-m svg{width:12px;height:12px}
.pill{background:var(--acc);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.pd{background:var(--purple)}
.acts{display:flex;gap:5px;flex-shrink:0}
.grp{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.7px}
/* filters */
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.inp,select.inp{height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--bord);background:var(--surf);color:var(--text);outline:none;min-width:0}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(58,120,242,.2)}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.seg{display:inline-flex;background:var(--surf2);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surf3);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.25)}
html[data-theme=light] .seg button.on{background:#fff}
/* emp grid */
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ec{cursor:pointer;transition:transform .15s,border-color .15s}
.ec:hover{transform:translateY(-2px);border-color:var(--bord2)}
.ec.ina{opacity:.5}
.ec-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ec-f{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px}
.ec-f b{color:var(--text)}
/* detail */
.dh{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dh-b{flex:1;min-width:180px}
.dh-n{font-size:22px;font-weight:800;letter-spacing:-.4px}
.dh-r{font-size:13px;color:var(--muted);margin-top:3px}
.dh-a{display:flex;gap:8px;flex-wrap:wrap}
.ring{position:relative;width:118px;height:118px;flex-shrink:0}
.ring svg{width:118px;height:118px;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-c b{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1}
.ring-c small{font-size:10.5px;color:var(--muted);margin-top:3px}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;min-width:260px}
.mini div{background:var(--surf2);border-radius:12px;padding:11px 12px}
.mini small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.mini b{display:block;font-size:20px;font-weight:800;margin-top:4px;letter-spacing:-.4px}
/* table */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.t th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:9px 7px;border-bottom:1px solid var(--bord);text-align:center;background:var(--surf)}
table.t td{padding:10px 7px;border-bottom:1px solid var(--bord);text-align:center}
table.t th:first-child,table.t td:first-child{text-align:left;position:sticky;left:0;background:var(--surf);z-index:1;padding-left:2px}
table.t tr:hover td{background:var(--surf2)}
table.t td.z{color:var(--muted2)}
table.t td.v{color:var(--blue);font-weight:700}
table.t tfoot td{font-weight:800;border-top:1px solid var(--bord2)}
.rem{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:700;font-size:11.5px}
/* settings */
.fg{display:flex;flex-direction:column;gap:6px}
.fg label{font-size:11.5px;font-weight:600;color:var(--text2)}
.fg .inp{width:100%}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .full{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--muted);line-height:1.45}
.logo-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo-prev{width:160px;height:80px;border-radius:12px;border:1px dashed var(--bord2);display:flex;align-items:center;justify-content:center;background:var(--surf2);overflow:hidden;color:var(--muted);font-size:11px}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.ov.open{display:flex;animation:fi .18s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.sheet{background:var(--surf);border:1px solid var(--bord2);border-radius:22px;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden;animation:su .22s cubic-bezier(.3,.8,.3,1)}
.sheet.sm{max-width:440px}.sheet.doc{max-width:900px;height:92vh}
@keyframes su{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--bord)}
.sh-h .tt{flex:1;min-width:0}.sh-h .tt b{font-size:16px;display:block}.sh-h .tt small{font-size:12px;color:var(--muted)}
.sh-b{padding:20px;overflow-y:auto;flex:1}
.sh-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--bord);flex-wrap:wrap;padding-bottom:max(14px,env(safe-area-inset-bottom))}
.calc{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#0741ad,#3a78f2);border-radius:15px;padding:13px 18px;color:#fff;margin-bottom:16px}
.calc.pd{background:linear-gradient(135deg,#bf5af2,#5e5ce6)}
.calc b{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.calc div{font-size:12.5px;opacity:.9;line-height:1.45}
.warn{display:flex;gap:8px;align-items:flex-start;font-size:12px;padding:9px 12px;border-radius:11px;margin-top:8px;line-height:1.4}
.warn svg{width:15px;height:15px;margin-top:1px}
.warn.o{background:rgba(255,159,10,.13);color:var(--orange)}.warn.r{background:rgba(255,69,58,.13);color:var(--red)}.warn.g{background:rgba(48,209,88,.13);color:var(--green)}
.rc{background:var(--surf2);border-radius:14px;padding:12px;max-width:440px;width:100%}
.rc-n{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:13.5px}
.rc-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.rc-h{font-size:10px;font-weight:700;text-align:center;color:var(--muted);padding:3px 0}
.rc-d{aspect-ratio:1;border:0;background:none;border-radius:9px;font-size:12.5px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.rc-d:hover{background:var(--surf3)}
.rc-d.sa{color:var(--orange)}.rc-d.su{color:var(--red)}.rc-d.hol{color:var(--teal);background:rgba(64,200,224,.14)}
.rc-d.has{box-shadow:inset 0 -3px 0 var(--purple)}
.rc-d.in{background:rgba(58,120,242,.2);border-radius:4px}

/* ───────── SVG bar chart (stacked, s tooltipom) ───────── */
function barChart(labels,series,opt){
 opt=opt||{};const W=opt.w||640,H=opt.h||230,pL=30,pR=6,pT=10,pB=24;
 const tot=labels.map((_,i)=>series.reduce((s,se)=>s+(se.values[i]||0),0));
 const mx=Math.max(4,...tot);const st=mx<=8?2:mx<=20?5:mx<=50?10:mx<=100?20:50;const top=Math.ceil(mx/st)*st;
 const ih=H-pT-pB,cw=(W-pL-pR)/labels.length,bw=Math.min(30,cw*.55);
 const gid='g'+Math.random().toString(36).slice(2,7);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible" preserveAspectRatio="none"><defs>`;
 series.forEach((se,k)=>s+=`<linearGradient id="${gid}${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.color}" stop-opacity="1"/><stop offset="1" stop-color="${se.color}" stop-opacity=".45"/></linearGradient>`);
 s+='</defs>';
 for(let v=0;v<=top;v+=st){const y=pT+ih*(1-v/top);s+=`<line x1="${pL}" x2="${W-pR}" y1="${y}" y2="${y}" style="stroke:var(--grid);stroke-width:1"/><text x="${pL-7}" y="${y+3.5}" text-anchor="end" style="fill:var(--muted);font-size:10px">${v}</text>`;}
 labels.forEach((l,i)=>{const x=pL+cw*i+(cw-bw)/2;let acc=0;
  series.forEach((se,k)=>{const v=se.values[i]||0;if(!v)return;const h=ih*v/top,y=pT+ih-ih*acc/top-h;acc+=v;const t=(se.tips&&se.tips[i])||`<b>${esc(l)}</b><br>${esc(se.name)}: ${v}`;
   s+=`<rect class="bar" x="${x}" y="${y}" width="${bw}" height="${Math.max(h,1.5)}" rx="${Math.min(5,bw/3)}" fill="url(#${gid}${k})" data-tip="${esc(t)}" style="cursor:pointer"/>`;});
  if(tot[i]&&opt.vals!==false)s+=`<text x="${x+bw/2}" y="${pT+ih-ih*tot[i]/top-5}" text-anchor="middle" style="fill:var(--text2);font-size:10px;font-weight:700">${tot[i]}</text>`;
  s+=`<text x="${pL+cw*i+cw/2}" y="${H-6}" text-anchor="middle" style="fill:var(--muted);font-size:10.5px">${esc(l)}</text>`;});
 return s+'</svg>';
}

 // izračun + upozorenja
 const p=F.tip==='pd',W=[];let box='';

const setSig=s=>{const c={...s};delete c._u;delete c.tema;return JSON.stringify(c);};
function snapshot(){SIG={e:{},d:{},s:setSig(D.settings)};D.emps.forEach(e=>SIG.e[e.id]=stripU(e));for(const k in D.decs)D.decs[k].forEach(d=>SIG.d[d.id]=k+'|'+stripU(d));}
function stamp(){
 if(!SIG){snapshot();return;}
 const n=Date.now(),sE={},sD={};D.del=D.del||{};
 D.emps.forEach(e=>{sE[e.id]=1;if(SIG.e[e.id]!==stripU(e))e._u=n;});
 for(const k in D.decs)D.decs[k].forEach(d=>{sD[d.id]=1;if(SIG.d[d.id]!==k+'|'+stripU(d))d._u=n;});
 Object.keys(SIG.e).forEach(id=>{if(!sE[id])D.del[id]=n;});
 Object.keys(SIG.d).forEach(id=>{if(!sD[id])D.del[id]=n;});
 if(SIG.s!==setSig(D.settings))D.settings._u=n;
 snapshot();
}
function canon(x){if(Array.isArray(x))return '['+x.map(canon).join(',')+']';if(x&&typeof x==='object')return '{'+Object.keys(x).filter(k=>x[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(x[k])).join(',')+'}';return JSON.stringify(x===undefined?null:x);}
const cmpView=x=>canon({e:x.emps||[],d:x.decs||{},s:{...(x.settings||{}),tema:null},del:x.del||{}});
function mergeData(A,B){ // A = lokalno, B = poslužitelj (kod jednakog _u vrijedi poslužitelj)
 const del={...(B.del||{})};for(const k in (A.del||{}))del[k]=Math.max(del[k]||0,A.del[k]);
 const old=Date.now()-200*864e5;for(const k in del)if(del[k]<old)delete del[k];
 const alive=o=>!(del[o.id]>=(o._u||0)&&del[o.id]);
 const em={};(B.emps||[]).forEach(e=>em[e.id]=e);(A.emps||[]).forEach(e=>{const c=em[e.id];if(!c||(e._u||0)>(c._u||0))em[e.id]=e;});
 const bIds=(B.emps||[]).map(e=>e.id),order=[...bIds,...(A.emps||[]).map(e=>e.id).filter(id=>!bIds.includes(id))];
 const emps=order.map(id=>em[id]).filter(e=>e&&alive(e));
 const dm={};for(const k in (B.decs||{}))(B.decs[k]||[]).forEach(d=>dm[d.id]={k,d});
 for(const k in (A.decs||{}))(A.decs[k]||[]).forEach(d=>{const c=dm[d.id];if(!c||(d._u||0)>(c.d._u||0))dm[d.id]={k,d};});
 const decs={};emps.forEach(e=>decs[e.id]=[]);
 Object.values(dm).forEach(({k,d})=>{if(alive(d)&&decs[k])decs[k].push(d);});
 const sa=A.settings||{},sb=B.settings||{},s=(sa._u||0)>(sb._u||0)?sa:sb;
 return {emps,decs,settings:{...s,tema:sa.tema||s.tema},del,_ts:Math.max(A._ts||0,B._ts||0)};
}
async function sbRpc(fn,body){
 const r=await fetch(SY.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SY.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const t=await r.text();if(!r.ok){let m=t;try{m=JSON.parse(t).message||t;}catch(x){}throw new Error(/NEISPRAVNA_SIFRA/.test(m)?'Neispravna šifra za sinkronizaciju':m||('HTTP '+r.status));}
 return t?JSON.parse(t):null;
}
function applyMerged(m){const keepTema=D.settings.tema;D=m;normalize();D.settings.tema=keepTema;snapshot();save(true,true);applyTheme();if(!$('#mo').classList.contains('open'))renderAll();}
let _sb=false,_sp=false,_stm=null;
function syncSoon(ms){if(!SY.on||!SY.secret)return;clearTimeout(_stm);_stm=setTimeout(()=>syncNow(true),ms==null?1500:ms);}
async function syncNow(silent,adopt){
 if(!SY.on||!SY.secret)return false;if(!navigator.onLine){setSync('off','Nema interneta — promjene čekaju');return false;}
 if(_sb){_sp=true;return false;}_sb=true;setSync('busy');
 try{
  let r=await sbRpc('go_pull',{p_key:SY.secret}),remote=r&&r.data,base=r?+r.ts||0:0;
  for(let i=0;i<5;i++){
   const local=JSON.parse(JSON.stringify(D));
   if(adopt&&remote&&i===0){if(local.settings)local.settings._u=0;}
   const merged=remote?mergeData(local,remote):local;
   if(cmpView(merged)!==cmpView(local)||adopt)applyMerged(JSON.parse(JSON.stringify(merged)));
   if(remote&&cmpView(merged)===cmpView(remote)){SY.base=base;break;}
   const p=await sbRpc('go_push',{p_key:SY.secret,p_data:merged,p_base:base});
   if(p&&p.ok){SY.base=+p.ts;break;}
   remote=p.data;base=+p.ts;adopt=false;
  }
  SY.last=Date.now();saveSY();setSync('ok');if(!silent)toast('Podaci sinkronizirani','g');return true;
 }catch(e){setSync('err',e.message||'Greška');if(!silent)toast(e.message||'Greška sinkronizacije','r');return false;}
 finally{_sb=false;if(_sp){_sp=false;syncSoon(300);}}
}
function setSync(st,msg){SYS={st,msg:msg||''};const b=$('#syBtn'),f=$('#syncSt');
 const col={ok:'var(--green)',busy:'var(--orange)',err:'var(--red)',off:'var(--muted)',idle:'var(--muted)'}[st];
 const txt=st==='ok'?'Sinkronizirano '+new Date(SY.last).toLocaleTimeString('hr-HR',{hour:'2-digit',minute:'2-digit'}):st==='busy'?'Sinkronizacija…':st==='err'?'Greška: '+SYS.msg:SY.on?(SYS.msg||'Čeka sinkronizaciju'):'Sinkronizacija isključena';
 if(b){b.style.color=col;b.setAttribute('data-tip',esc(txt));b.innerHTML=ic(st==='err'?'cloudx':'cloud');b.classList.toggle('spin',st==='busy');}
 if(f)f.innerHTML=`<span style="color:${col}">●</span> ${esc(txt)}`;
 const ps=$('#sySet');if(ps)ps.innerHTML=`<span style="color:${col}">●</span> ${esc(txt)}`;
}
function syncClick(){if(!SY.on){go('postavke');setTimeout(()=>{const c=$('#syCard');if(c)c.scrollIntoView({behavior:'smooth'});},120);return;}syncNow(false);}
async function syncConnect(){
 const sec=($('#sySecret').value||'').trim(),url=($('#syUrl').value||'').trim()||SB_DEF.url,key=($('#syKey').value||'').trim()||SB_DEF.key;
 if(sec.length<6){toast('Upišite šifru za sinkronizaciju','r');return;}
 SY={...SY,on:true,secret:sec,url,key,base:0};saveSY();
 const ok=await syncNow(false,true);
 if(!ok){SY.on=false;saveSY();setSync('err',SYS.msg);}
 renderView();
}
function syncOff(){confirmBox('Prekid sinkronizacije','Ovaj uređaj više neće razmjenjivati podatke s bazom. Lokalni podaci ostaju.','Prekini',()=>{SY.on=false;SY.secret='';saveSY();setSync('off');renderView();toast('Sinkronizacija isključena');});}
addEventListener('online',()=>syncSoon(500));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncSoon(200);});
setInterval(()=>{if(SY.on&&document.visibilityState==='visible')syncNow(true);},60000);

/* ───────── Prijava (PIN) ───────── */
function sha256(s){const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const b=new TextEncoder().encode(s),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;const bl=l*8;for(let i=0;i<4;i++)m[n-1-i]=(bl>>>(8*i))&255;
 let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Array(64),r=(x,y)=>(x>>>y)|(x<<(32-y));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=(m[o+i*4]<<24)|(m[o+i*4+1]<<16)|(m[o+i*4+2]<<8)|m[o+i*4+3];for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
  let[a,bb,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&c)^(bb&c),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;}
  H=H.map((x,i)=>(x+[a,bb,c,d,e,f,g,h][i])|0);}
 return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');}
const DEF_PIN='1234';
const pinH=p=>sha256((D.settings.pinSalt||'dys')+':'+p);
const pinOk=p=>D.settings.pinHash?pinH(p)===D.settings.pinHash:p===DEF_PIN;
const AUTH='dysgo_auth';
let LK={mode:'login',val:'',first:'',fails:0,until:0},_act=Date.now();
function authed(){try{const a=JSON.parse(sessionStorage.getItem(AUTH)||'null');return a&&Date.now()-a.t<(+D.settings.lockMin||15)*60000;}catch(x){return false;}}
function touchAuth(){try{sessionStorage.setItem(AUTH,JSON.stringify({t:Date.now()}));}catch(x){}}
function lockApp(){if(!D.settings.pinOn){toast('Prijava PIN-om je isključena (Postavke → Sigurnost)');return;}try{sessionStorage.removeItem(AUTH);}catch(x){}closeModal();closePrev();toggleSb(false);showLock('login');}
function showLock(mode){LK.mode=mode;LK.val='';LK.first='';const L=$('#lock');L.classList.add('open');renderLock();setTimeout(()=>{const i=$('#lkIn');if(i)i.focus();},80);}
function hideLock(){$('#lock').classList.remove('open');touchAuth();_act=Date.now();}
function renderLock(msg,err){
 const s=D.settings,T={login:['Prijava','Unesite PIN za pristup aplikaciji'],new:['Novi PIN',s.pinMustChange&&!s.pinHash?'Početni PIN je 1234 — postavite vlastiti PIN (4–8 znamenki)':'Unesite novi PIN (4–8 znamenki)'],confirm:['Potvrda PIN-a','Ponovno unesite novi PIN']}[LK.mode];
 $('#lkLogo').innerHTML=s.logo?`<img src="${s.logo}" alt="Logo" style="max-height:60px;max-width:100%">`:BRAND_SVG;
 $('#lkT').textContent=T[0];$('#lkS').textContent=msg||T[1];$('#lkS').className='lk-s'+(err?' err':'');
 $('#lkDots').innerHTML=Array.from({length:Math.max(4,LK.val.length)},(_,i)=>`<i class="${i<LK.val.length?'on':''}"></i>`).join('');
 $('#lkCo').textContent=s.naziv||'';$('#lkV').textContent=VLBL;
 const i=$('#lkIn');if(i)i.value=LK.val;
}
function lkKey(k){if(Date.now()<LK.until){renderLock('Previše pokušaja — pričekajte '+Math.ceil((LK.until-Date.now())/1000)+' s',true);return;}
 if(k==='del'){LK.val=LK.val.slice(0,-1);renderLock();return;}if(k==='ok'){lkSubmit();return;}
 if(/^\d$/.test(k)&&LK.val.length<8){LK.val+=k;renderLock();}}
function lkSubmit(){
 const v=LK.val;
 if(LK.mode==='login'){
  if(v.length<4){renderLock('PIN ima najmanje 4 znamenke',true);return;}
  if(pinOk(v)){LK.fails=0;if(!D.settings.pinHash||D.settings.pinMustChange){LK.mode='new';LK.val='';renderLock();return;}hideLock();toast('Dobro došli','g');return;}
  LK.fails++;LK.val='';if(LK.fails>=5){LK.until=Date.now()+30000;LK.fails=0;renderLock('Previše pogrešnih pokušaja — pričekajte 30 s',true);}else renderLock('Pogrešan PIN ('+LK.fails+'/5)',true);
  $('#lkDots').classList.remove('shake');void $('#lkDots').offsetWidth;$('#lkDots').classList.add('shake');return;}
 if(LK.mode==='new'){if(v.length<4){renderLock('PIN mora imati 4–8 znamenki',true);return;}if(v===DEF_PIN){LK.val='';renderLock('Odaberite PIN različit od početnog',true);return;}LK.first=v;LK.mode='confirm';LK.val='';renderLock();return;}
 if(LK.mode==='confirm'){if(v!==LK.first){LK.mode='new';LK.val='';LK.first='';renderLock('PIN-ovi se ne podudaraju — pokušajte ponovno',true);return;}
  D.settings.pinHash=pinH(v);D.settings.pinMustChange=false;save();hideLock();toast('PIN je postavljen','g');if(S.view==='postavke')renderView();}
}
document.addEventListener('keydown',e=>{if(!$('#lock').classList.contains('open'))return;if(/^\d$/.test(e.key)){e.preventDefault();lkKey(e.key);}else if(e.key==='Backspace'){e.preventDefault();lkKey('del');}else if(e.key==='Enter'){e.preventDefault();lkKey('ok');}},true);
function changePin(){showLock('new');$('#lkS').textContent='Unesite novi PIN (4–8 znamenki)';}
['mousemove','keydown','touchstart','click','scroll'].forEach(ev=>document.addEventListener(ev,()=>{const n=Date.now();if(n-_act>5000){_act=n;if(D.settings.pinOn&&!$('#lock').classList.contains('open'))touchAuth();}},{passive:true,capture:true}));
setInterval(()=>{if(D.settings.pinOn&&!$('#lock').classList.contains('open')&&Date.now()-_act>(+D.settings.lockMin||15)*60000)lockApp();},20000);

/* ───────── Init ───────── */
load();applyTheme();renderAll();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}$('#sbVer').innerHTML='<span class="vtag">'+VLBL+'</span>';
if(D.settings.pinOn&&!authed())showLock('login');else touchAuth();
snapshot();setSync(SY.on?'idle':'off');if(SY.on)syncNow(true);
let _rz;addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(S.view==='dash')drawDashCharts();else if(S.view==='emp')renderView();},200);});
</script>
